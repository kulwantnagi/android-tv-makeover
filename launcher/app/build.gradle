plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kulwant.atvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kulwant.atvhome'
        minSdk 28
        //noinspection ExpiredTargetSdkVersion  sideloaded TV launcher, matches the TV's API level
        targetSdk 28
        versionCode 1
        versionName '1.0'

        // Personal settings come from launcher/personal.properties (git-ignored), so they're never
        // published. Each one is optional: empty hides the greeting name / that counter.
        def personal = new Properties()
        def personalFile = rootProject.file('personal.properties')
        if (personalFile.exists()) personalFile.withInputStream { personal.load(it) }
        ['greeting_name', 'youtube_channel', 'instagram_user', 'facebook_page'].each { key ->
            resValue 'string', key, personal.getProperty(key, '').replace('@', '\\@')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // ADB client: the phone remote presses keys through the TV's own network ADB (see KeyInjector)
    implementation 'dev.mobile:dadb:1.2.10'
}
